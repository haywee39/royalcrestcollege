<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">

    <title>Nav- Royal Crest College</title>

<style>
    html{
      overflow-x: hidden;
    }
    html, body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        color: white;
    }
    h1, h2, h3, h4, h5, h6 {
        font-family: 'Merriweather', serif;
        color: rgb(85, 4, 4);;
    }
    p, a, b{
      font-size: 18px;
      text-decoration: none;
    }

    p, a{
        font-weight: normal;
      }

   /* MENU / CLOSE toggle */
    .menu-toggle {
      position: fixed;
      top: 3.5rem;
      left: 20px;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      z-index: 10000;     
      text-decoration: underline;
      text-underline-offset: 15px;
      letter-spacing: 2px;
      user-select: none;
    }
     .tour {
      position: fixed;
      top: 3.5rem;
      right: 20px;
      text-align: right;
      font-size: 1rem;
      color: white;
      cursor: pointer;
      z-index: 10000;
      text-decoration: underline;
      text-underline-offset: 15px;
      letter-spacing: 2px;
      user-select: none;
    }
    .logo {
      position: absolute;
      top: 20vh;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10000;
    }
    .logo{
      width: 120px;
      height: 120px;
      border: white 1px solid;
      background: white;
    }
 /* Fullscreen overlay menu */
    .fullscreen-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgb(85, 4, 4);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 150px 30px;
      transform: translateY(-100%);
      transition: transform 0.4s ease;
      z-index: 9999;
    }
    .fullscreen-menu.show {
      transform: translateY(0);
    }

    /* Nav links */
    .fullscreen-menu a {
      position: relative;
      display: inline-block;
      color: white;
      font-size: 1.3rem;
      margin: 15px 0;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    .fullscreen-menu a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 0;
      height: 2px;
      background-color: white;
      transition: width 0.3s ease;
    }
    
    .fullscreen-menu a:hover::after {
      width: 100%;
    }

    /* Responsive Design */
@media (max-width: 768px) {
  .logo{
    display: none;
    visibility: hidden;
  }
}
  /* ***************************************** */
</style>
</head>
<body>
    <header class="hero-section">
        <!-- MENU text (toggle) -->
        <div id="menuToggle" class="menu-toggle">MENU</div>
         <a class="tour" href="admissions.html">Schedule a Tour</a>

        <!-- Fullscreen Menu -->
        <div id="fullscreenNav" class="fullscreen-menu">
          <img class="logo" src="./homeimg/ryclogo-removebg-preview.png" alt="school-logo">
          <a href="index.html">HOME</a>
          <a href="about.html">ABOUT US</a>
          <a href="academics.html">ACADEMICS</a>         
          <a href="admissions.html">ADMISSIONS</a>
          <a href="contact.html">CONTACT US</a>
          <a href="arts.html">Arts</a>
          <a href="athletics.html">Athletics</a>
          <a href="schoolanthem.html">School Anthem</a>
          <a href="nationalanthem.html">National Anthem</a>
        </div>
       
    </header>
    
  <script>
    // FULLSCREEN MENU DESIGN
  const menuToggle = document.getElementById("menuToggle");
  const fullscreenNav = document.getElementById("fullscreenNav");
  let menuOpen = false;

  menuToggle.addEventListener("click", () => {
    menuOpen = !menuOpen;
    if (menuOpen) {
      fullscreenNav.classList.add("show");
      menuToggle.textContent = "CLOSE";
    } else {
      fullscreenNav.classList.remove("show");
      menuToggle.textContent = "MENU";
    }
  });
  </script>  
</body>
</html>
