<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Loader</title>
  <style>
    /* Loader Container */
    #loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color:rgb(85, 4, 4);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
    }

    /* Logo */
    #loader img {
      width: 120px; /* adjust as needed */
      margin-bottom: 20px;
    }

    /* Percentage text */
    #percentage {
      color: white;
      font-size: 24px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    /* Progress Bar */
    .progress-bar {
      width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #fff;
      transition: width 0.05s linear;
    }

    /* Hide loader when done */
    .fade-out {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    /* Website content (hidden under loader initially) */
    #content {
      display: none;
      text-align: center;
      padding: 50px;
    }
  </style>
</head>
<body>
  <!-- Loader -->
  <div id="loader">
    <img src="./homeimg/ryclogo-removebg-preview.png" alt="Logo"> <!-- Replace with your logo -->
    <div id="percentage">0%</div>
    <div class="progress-bar">
      <div class="progress-bar-fill"></div>
    </div>
  </div>

  <!-- Website Content -->
  <div id="content">
    <h1>Welcome to My Website</h1>
    <p>This is the main page content after the loader disappears.</p>
  </div>

  <script>
    let percent = 0;
    let percentageText = document.getElementById("percentage");
    let progressBarFill = document.querySelector(".progress-bar-fill");
    let loader = document.getElementById("loader");
    let content = document.getElementById("content");

    let interval = setInterval(() => {
      percent++;
      percentageText.textContent = percent + "%";
      progressBarFill.style.width = percent + "%";

      if (percent >= 100) {
        clearInterval(interval);
        loader.classList.add("fade-out");
        setTimeout(() => {
          loader.style.display = "none";
          content.style.display = "block";
        }, 800);
      }
    }, 30); // Adjust speed (30ms × 100 = 3 seconds total)
  </script>
</body>
</html>
